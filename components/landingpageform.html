<div class="landingpageform appoinment-area-main bg_image">
    <h2 class="title landingpageform-title">Get a Free Consultation</h2>
    <form class="empire-lead-form landingpageform-fields" data-contact-form="true">
        <input type="text" name="website" tabindex="-1" autocomplete="off" class="lead-hidden-field" aria-hidden="true">
        <div class="lead-form-grid landingpageform-grid">
            <div class="form-field">
                <label for="landing-lead-full-name">Full Name</label>
                <input id="landing-lead-full-name" name="full_name" type="text" placeholder="Your Name" required>
            </div>
            <div class="form-field">
                <label for="landing-lead-company-name">Company Name</label>
                <input id="landing-lead-company-name" name="company_name" type="text" placeholder="Enter company name">
            </div>
            <div class="form-field">
                <label for="landing-lead-email">Email Address</label>
                <input id="landing-lead-email" name="email" type="email" placeholder="name@company.com" required>
            </div>
            <div class="form-field">
                <label for="landing-lead-contact-number">Contact Number</label>
                <input id="landing-lead-contact-number" name="contact_number" type="tel" placeholder="800-233-1234">
            </div>
            <div class="form-field">
                <label for="landing-lead-verify-email">Verify Email</label>
                <input id="landing-lead-verify-email" name="verify_email" type="email" placeholder="Confirm email address" required>
            </div>
            <div class="form-field">
                <label for="landing-lead-source">Source</label>
                <select id="landing-lead-source" name="source">
                    <option value="">Source</option>
                    <option value="google">Google</option>
                    <option value="chatgpt">ChatGPT</option>
                    <option value="referral">Referral</option>
                    <option value="linkedin">LinkedIn</option>
                    <option value="website">Website</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>
        <div class="form-field full-width">
            <label for="landing-lead-workflow">What are you looking to build?</label>
            <select id="landing-lead-workflow" name="workflow">
                <option value="benefits-verification" selected>Need help with?</option>
                <option value="prior-authorization">Prior Authorization</option>
                <option value="appointment-scheduling">Scheduling &amp; Referrals</option>
                <option value="denial-management">Denial Management</option>
                <option value="patient-self-pay">Patient Collections</option>
                <option value="member-services">Member Services</option>
                <option value="enrollment-support">Enrollment Support</option>
                <option value="provider-data">Provider Data</option>
            </select>
        </div>
        <div class="form-field full-width">
            <label for="landing-lead-message">Message</label>
            <textarea id="landing-lead-message" name="message" rows="4" placeholder="Tell us about your workflow goals. Do not include sensitive healthcare information."></textarea>
        </div>
        <label class="lead-consent landingpageform-consent">
            <input type="checkbox" name="privacy_consent" required>
            <span>By ticking this box I agree that I have read the <a href="#">privacy policy</a>.</span>
        </label>
        <div class="lead-form-status" role="status" aria-live="polite" hidden></div>
        <button type="submit" class="rts-btn btn-primary lead-submit landingpageform-submit">Get My Healthcare Operations Plan</button>
    </form>
</div>
